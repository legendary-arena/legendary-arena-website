baseURL = "https://www.legendary-arena.com/"
locale = "en-us"
title = "Legendary Arena"
theme = "PaperMod"

# Pretty URLs without /index.html
canonifyURLs = true

# RSS, sitemap, etc.
enableRobotsTXT = true

[params]
  env = "production"
  description = "A digital adaptation of the Legendary: A Marvel Deck Building Game."
  author = "Jeffery Jensen"
  defaultTheme = "auto"            # respects user's system light/dark preference
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true

  # Home page is rendered by layouts/index.html (WP-004 approach A).
  # PaperMod's [params.homeInfoParams] block was the WP-001 placeholder
  # mechanism but cannot host a styled .button CTA above the fold,
  # so it was removed when the override landed. See
  # docs/04-CONTENT-CONVENTIONS.md "Home page markup" for the full
  # rationale.

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false

# why: PaperMod's built-in Fuse.js search consumes a JSON index
# generated by including "JSON" in [outputs] home. WP-005 replaces
# Fuse with Pagefind (build-time index in public/pagefind/); the
# JSON output is no longer needed and is removed to prevent two
# search affordances from co-existing. PaperMod's
# themes/PaperMod/layouts/search.html template remains untouched in
# the submodule — it is harmless without content/search.md and
# without the JSON index.
