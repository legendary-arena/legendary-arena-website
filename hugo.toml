baseURL = "https://www.legendary-arena.com/"
locale = "en-us"
title = "Legendary Arena"
theme = "PaperMod"

# Pretty URLs without /index.html
canonifyURLs = true

# RSS, sitemap, etc.
enableRobotsTXT = true

[params]
  env = "production"
  description = "A digital adaptation of the Legendary: A Marvel Deck Building Game."
  author = "Jeffery Jensen"
  defaultTheme = "auto"            # respects user's system light/dark preference
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true

  # Home page is rendered by layouts/index.html (WP-004 approach A).
  # PaperMod's [params.homeInfoParams] block was the WP-001 placeholder
  # mechanism but cannot host a styled .button CTA above the fold,
  # so it was removed when the override landed. See
  # docs/04-CONTENT-CONVENTIONS.md "Home page markup" for the full
  # rationale.

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false

# why: PaperMod's built-in Fuse.js search consumes a JSON index
# generated by including "JSON" in [outputs] home. WP-005 replaces
# Fuse with Pagefind (build-time index in public/pagefind/); the
# JSON output is no longer needed and is removed to prevent two
# search affordances from co-existing. PaperMod's
# themes/PaperMod/layouts/search.html template remains untouched in
# the submodule — it is harmless without content/search.md and
# without the JSON index.

# Header menu — iterated by layouts/_partials/header.html
# (custom override; lines 104-128). The PaperMod logo (top-left)
# already links Home, so Home is intentionally not in this menu.
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  # why: trailing slash is REQUIRED. The header partial performs
  # exact string comparison for active-state styling
  # (cond (strings.HasSuffix .URL "/") .URL ...) at lines 105-107,
  # then exact-string compare against $page_url at line 112. A
  # missing trailing slash silently breaks <span class="active">
  # on the matching page — no error, the active state just never
  # lands. Hugo's canonifyURLs = true is a complementary guard at
  # render time but does NOT compensate for missing trailing
  # slashes in [[menu.main]] / [[menu.footer]] URL fields.
  url = "/posts/"
  weight = 20

# Footer menu — iterated by layouts/_partials/footer.html
# (introduced by WP-010). PaperMod does not iterate
# site.Menus.footer natively, so the override is the only consumer.
[[menu.footer]]
  identifier = "footer-about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.footer]]
  identifier = "footer-blog"
  name = "Blog"
  url = "/posts/"
  weight = 20

[[menu.footer]]
  identifier = "footer-play"
  name = "Play"
  url = "https://play.legendary-arena.com/"
  weight = 30

[[menu.footer]]
  identifier = "footer-cards"
  name = "Cards"
  url = "https://cards.barefootbetters.com/"
  weight = 40
