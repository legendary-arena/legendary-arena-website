baseURL = "https://www.legendary-arena.com/"
locale = "en-us"
title = "Legendary Arena"
theme = "PaperMod"

# Pretty URLs without /index.html
canonifyURLs = true

# RSS, sitemap, etc.
enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  env = "production"
  snipcartApiKey = "MGJjY2E4MGEtYjI4Ni00YmNkLThmOGItYmJiMzNiNGY3N2VkNjM5MTQyMzYwMzA0NTM3MjE4"
  description = "Legendary Arena is a skill-first, web-based deck-building system. Assemble your heroes, face the scenario, and earn your standing."
  author = "Jeffery Jensen"
  defaultTheme = "auto"            # respects user's system light/dark preference
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true

  # Home page is rendered by layouts/index.html (WP-004 approach A).
  # PaperMod's [params.homeInfoParams] block was the WP-001 placeholder
  # mechanism but cannot host a styled .button CTA above the fold,
  # so it was removed when the override landed. See
  # docs/04-CONTENT-CONVENTIONS.md "Home page markup" for the full
  # rationale.

# Schema.org publisher config (WP-008). Consumed by:
#   layouts/_partials/seo/schema.html      (Organization + WebSite on home)
#   themes/PaperMod/layouts/_partials/templates/schema_json.html
#                                          (BlogPosting.publisher on posts)
# See docs/05-SEO-CONVENTIONS.md for the full discipline.
[params.schema]
  publisherType = "Organization"
  # sameAs intentionally empty at WP-008 lock. The site has no
  # canonical social profile URLs to surface yet (no Twitter / X,
  # no Mastodon, no LinkedIn org page, no GitHub org page at a
  # public-facing URL). Adding a real entry is the natural
  # follow-up to a "marketing presence" effort outside WP-008's
  # scope. Keeping the array empty (vs. omitting the key) makes
  # the gap explicit to the next author touching this map and
  # avoids a silent "Organization with no sameAs" Rich Results
  # warning by emitting the empty array honestly.
  sameAs = []

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
    lineNos = false
  # why: enable raw HTML pass-through in markdown content so the
  # /brand/ page (WP-014) can carry the mandated <details> /
  # <summary> collapsibles (Color System + Typography full-spec),
  # the DO / DON'T <ul class="usage-rules"> checklist with inline
  # SVG icons (Usage Guidelines), and the <div class="brand-swatch-grid">
  # wrappers around the brand-swatch shortcode emissions. Goldmark's
  # default `unsafe = false` silently strips raw HTML and prints a
  # "Raw HTML omitted" warning. This is additive: existing pages
  # (/, /about/, /posts/, posts) author no raw HTML and are
  # unaffected. Scope lock: this block is a sibling to
  # [markup.highlight], not a modification to [params] or to any
  # WP-004 / WP-005 / WP-006 / WP-010 commentary block.
  [markup.goldmark.renderer]
    unsafe = true

# why: PaperMod's built-in Fuse.js search consumes a JSON index
# generated by including "JSON" in [outputs] home. WP-005 replaces
# Fuse with Pagefind (build-time index in public/pagefind/); the
# JSON output is no longer needed and is removed to prevent two
# search affordances from co-existing. PaperMod's
# themes/PaperMod/layouts/search.html template remains untouched in
# the submodule — it is harmless without content/search.md and
# without the JSON index.

# Header menu — iterated by layouts/_partials/header.html
# (custom override; lines 104-128). The PaperMod logo (top-left)
# already links Home, so Home is intentionally not in this menu.
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  # why: trailing slash is REQUIRED. The header partial performs
  # exact string comparison for active-state styling
  # (cond (strings.HasSuffix .URL "/") .URL ...) at lines 105-107,
  # then exact-string compare against $page_url at line 112. A
  # missing trailing slash silently breaks <span class="active">
  # on the matching page — no error, the active state just never
  # lands. Hugo's canonifyURLs = true is a complementary guard at
  # render time but does NOT compensate for missing trailing
  # slashes in [[menu.main]] / [[menu.footer]] URL fields.
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 22

[[menu.main]]
  identifier = "shop"
  name = "Shop"
  url = "/shop/"
  weight = 25

[[menu.main]]
  identifier = "brand"
  name = "Brand"
  url = "/brand/"
  weight = 30

# Play / Cards — primary conversion paths surfaced in the header
# (previously footer-only; see [[menu.footer]] below). These are the
# first EXTERNAL items in menu.main. The header partial
# (layouts/_partials/header.html lines 117-124) detects external links
# via `findRE "://" .URL` and renders the outbound-link SVG icon. Note:
# unlike footer.html, the header partial does NOT add
# target="_blank" rel="noopener" — external header links open in the
# same tab. That is intentional for Play (a destination, not a reference
# link); if same-tab is ever wrong for these, the fix is in header.html,
# not here.
[[menu.main]]
  identifier = "play"
  name = "Play"
  url = "https://play.legendary-arena.com/"
  weight = 40

[[menu.main]]
  identifier = "cards"
  name = "Cards"
  url = "https://cards.barefootbetters.com/"
  weight = 50

# Sign in / My account — link to the game's existing Hanko sign-in and
# profile on play.legendary-arena.com. Decided by engine-repo DECISIONS
# D-24084 (2026-06-30): www stays a static marketing surface and does NOT
# own an auth surface; it links to play. This finally adds the "Log In"
# entry WP-027 deferred ("no marketing-site login URL exists yet"). Same
# external-link treatment as Play/Cards (outbound icon via header.html's
# findRE "://"). Passwordless model — copy is "Sign in" / "My account",
# never "Log in / Log out" (the static site cannot know auth state) and
# never "change password".
[[menu.main]]
  identifier = "signin"
  name = "Sign in"
  url = "https://play.legendary-arena.com/?route=login"
  weight = 60

[[menu.main]]
  identifier = "account"
  name = "My account"
  url = "https://play.legendary-arena.com/?route=me"
  weight = 70

# Footer menu — iterated by layouts/_partials/footer.html
# (introduced by WP-010). PaperMod does not iterate
# site.Menus.footer natively, so the override is the only consumer.
[[menu.footer]]
  identifier = "footer-about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.footer]]
  identifier = "footer-blog"
  name = "Blog"
  url = "/posts/"
  weight = 20

[[menu.footer]]
  identifier = "footer-shop"
  name = "Shop"
  url = "/shop/"
  weight = 22

[[menu.footer]]
  identifier = "footer-brand"
  name = "Brand"
  url = "/brand/"
  weight = 25

[[menu.footer]]
  identifier = "footer-play"
  name = "Play"
  url = "https://play.legendary-arena.com/"
  weight = 30

[[menu.footer]]
  identifier = "footer-cards"
  name = "Cards"
  url = "https://cards.barefootbetters.com/"
  weight = 40
