# active-state note above.
[[menu.footer]]
  identifier = "footer-tournaments"
  name = "Tournaments"
  url = "/tournaments/"
  weight = 29

[[menu.footer]]
  identifier = "footer-play"
  name = "Play"
  url = "https://play.legendary-arena.com/"
  weight = 30

[[menu.footer]]
  identifier = "footer-cards"
  name = "Cards"
  url = "https://cards.legendary-arena.com/"
  weight = 40
