<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Arena Structure - Hexagonal base -->
  <g id="arena-mark">
    <!-- Main hexagonal arena boundary -->
    <path d="M 30 40 L 70 10 L 110 40 L 110 100 L 70 130 L 30 100 Z" stroke="#1a1a1a" stroke-width="4" fill="none"/>

    <!-- Inner converging lines - representing mastery paths -->
    <path d="M 30 40 L 70 70" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 70 10 L 70 70" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 110 40 L 70 70" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 110 100 L 70 70" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 70 130 L 70 70" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 30 100 L 70 70" stroke="#1a1a1a" stroke-width="3"/>

    <!-- Central point - the apex of mastery -->
    <circle cx="70" cy="70" r="8" fill="#1a1a1a"/>

    <!-- Upward thrust elements - vertical pillars -->
    <rect x="60" y="25" width="6" height="30" fill="#1a1a1a"/>
    <rect x="74" y="25" width="6" height="30" fill="#1a1a1a"/>

    <!-- Sharp terminals at top -->
    <path d="M 62 25 L 66 15 L 70 25" fill="#1a1a1a"/>
    <path d="M 76 25 L 80 15 L 84 25" fill="#1a1a1a"/>
  </g>
</svg>
